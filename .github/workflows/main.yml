  update-helm-values:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          VALUES_FILE="project/project/values.yaml"

          echo "Before update:"
          cat $VALUES_FILE

          sed -i "s/tag:.*/tag: \"${{ github.run_id }}\"/" $VALUES_FILE

          echo "After update:"
          cat $VALUES_FILE

      - name: Commit and push Helm update
        run: |
          git config --global user.email "babusuccess@gmail.com"
          git config --global user.name "babusuccess"

          git add project/project/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update nginx image tag to ${{ github.run_id }}"
            git push origin main
          fi

      - name: Deploy with Helm
        run: |
          helm upgrade --install my-release ./project/project -f ./project/project/values.yaml
