name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          pwd
          ls -la
          echo "Dockerfiles:"
          find . -iname "Dockerfile"

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "./project/project/Dockerfile" ]; then
            echo "Dockerfile not found"
            find . -iname "Dockerfile"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./project/project
          file: ./project/project/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}


  update-helm-values:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in values.yaml
        run: |
          VALUES_FILE="./project/project/values.yaml"

          echo "Before update:"
          cat $VALUES_FILE

          sed -i "s/tag:.*/tag: \"${{ github.run_id }}\"/" $VALUES_FILE

          echo "After update:"
          cat $VALUES_FILE

      - name: Commit and push Helm update
        run: |
          git config --global user.email "babusuccess@gmail.com"
          git config --global user.name "babusuccess"

          git add ./project/project/values.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update nginx image tag to ${{ github.run_id }}"
            git push origin main
          fi


  deploy:
    runs-on: ubuntu-latest
    needs: update-helm-values

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      # Add your Kubernetes login step here
      # Example:
      # - name: Configure Kubernetes
      #   run: |
      #     aws eks update-kubeconfig ...
      #     OR
      #     az aks get-credentials ...
      #     OR
      #     gcloud container clusters get-credentials ...

      - name: Deploy Helm chart
        run: |
          helm upgrade --install my-release ./project/project \
            -f ./project/project/values.yaml
