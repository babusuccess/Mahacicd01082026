name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Searching for Dockerfile..."
          find . -iname "Dockerfile"

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "./project/project/Dockerfile" ]; then
            echo "ERROR: Dockerfile not found at ./project/project/Dockerfile"
            echo "Available Dockerfiles:"
            find . -iname "Dockerfile"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./project/project
          file: ./project/project/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in Helm chart
        run: |
          echo "Before update:"
          cat project/project/values.yaml

          sed -i 's/tag:.*/tag: "${{ github.run_id }}"/' project/project/values.yaml

          echo "After update:"
          cat project/project/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.email "babusuccess@gmail.com"
          git config --global user.name "babusuccess"

          git add project/project/values.yaml

          git diff --cached --quiet || git commit -m "Update Helm chart image tag to ${{ github.run_id }}"

          git push
