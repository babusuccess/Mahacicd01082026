name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'


jobs:

  build:

    if: "!contains(github.event.head_commit.message, 'Update tag in Helm chart')"

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0


    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    - name: Build and Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}


    # Install Trivy Security Scanner
    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
        https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy


    # Image Vulnerability Scan
    - name: Scan Docker Image with Trivy
      continue-on-error: true
      run: |
        trivy image \
          --severity HIGH,CRITICAL \
          --format table \
          ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}



  update-newtag-in-helm-chart:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      contents: write

    steps:


    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true


    - name: Configure Git Authentication
      run: |
        git config --global user.email "babusuccess@gmail.com"
        git config --global user.name "babusuccess"

        git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git


    - name: Get latest code
      run: |
        git fetch origin main
        git checkout main
        git reset --hard origin/main


    - name: Check current values.yaml
      run: |
        echo "Current values.yaml:"
        cat values.yaml


    - name: Update image tag in Helm chart
      run: |
        echo "Before update:"
        cat values.yaml

        sed -i 's/tag:.*/tag: "${{ github.run_id }}"/' values.yaml

        echo "After update:"
        cat values.yaml


    - name: Commit and push changes
      run: |
        git add values.yaml

        echo "Changes:"
        git diff --cached

        if git diff --cached --quiet; then
          echo "No changes detected"
          exit 0
        fi

        git commit -m "Update tag in Helm chart"

        git push origin main


    - name: Pull latest changes and verify updated tag
      run: |
        echo "Pulling latest main branch..."
        git pull origin main

        echo "Final values.yaml:"
        cat values.yaml
