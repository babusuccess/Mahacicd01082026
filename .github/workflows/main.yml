# CICD using GitHub actions
name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'

jobs:

  build:

    if: "!contains(github.event.head_commit.message, 'Update tag in Helm chart')"

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}

    # Image Security Scan
    - name: Install Trivy
      uses: aquasecurity/setup-trivy@v0.2.3

    - name: Scan Docker Image with Trivy
      run: |
        trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}


  update-newtag-in-helm-chart:

    runs-on: ubuntu-latest

    needs: build

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true

    - name: Get latest code
      run: |
        git fetch origin main
        git checkout main
        git reset --hard origin/main

    - name: Check values.yaml
      run: |
        pwd
        ls -la
        cat values.yaml

    - name: Update tag in Helm chart
      run: |
        echo "Before update:"
        cat values.yaml

        sed -i 's/tag:.*/tag: "${{ github.run_id }}"/' values.yaml

        echo "After update:"
        cat values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "babusuccess@gmail.com"
        git config --global user.name "babusuccess"

        echo "Git status:"
        git status

        git add values.yaml

        echo "Staged changes:"
        git diff --cached

        git commit -m "Update tag in Helm chart"

        git push origin main

    - name: Pull latest changes and verify updated tag
      run: |
        echo "Pulling latest changes..."
        git pull origin main

        echo "Latest values.yaml after tag update:"
        cat values.yaml
