# CICD using GitHub actions
name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'

jobs:

  build:

    if: "!contains(github.event.head_commit.message, 'Update tag in Helm chart')"

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.run_id }}


  update-newtag-in-helm-chart:

    runs-on: ubuntu-latest

    needs: build

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ github.TOKEN }}
        fetch-depth: 0

    - name: Pull latest changes
      run: |
        git pull origin main

    - name: Check values.yaml location
      run: |
        pwd
        ls -la
        find . -name values.yaml

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag:.*/tag: "${{ github.run_id }}"/' values.yaml
        echo "Updated values.yaml:"
        cat values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "babusuccess@gmail.com"
        git config --global user.name "babusuccess"

        git add values.yaml

        git commit -m "Update tag in Helm chart" || echo "No changes to commit"

        git pull --no-rebase origin main

        git push origin main


  final-git-pull:

    runs-on: ubuntu-latest

    needs: update-newtag-in-helm-chart

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Final git pull after completion
      run: |
        git pull origin main
        echo "Final git pull completed successfully"
