apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: {{ .Values.app }}
    env: {{ .Values.env }}
spec:
  selector:
    app: {{ .Values.app }}
    env: {{ .Values.env }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.containerPort }}
  type: ClusterIP