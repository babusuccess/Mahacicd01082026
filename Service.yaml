apiVersion: v1
kind: Service

metadata:
  name: nginx-service
  labels:
    app: dev
    env: mydev

spec:
  type: {{ .Values.service.type }}

  selector:
    app: dev
    env: mydev

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}