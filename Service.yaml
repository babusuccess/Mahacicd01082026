apiVersion: v1
kind: Service

metadata:
  name: nginx-service
  labels:
    app: {{ .Values.app }}
    env: {{ .Values.env }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ .Values.app }}
    env: {{ .Values.env }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}